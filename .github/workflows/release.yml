name: KaraVox Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after verification"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: karavox-release-${{ github.ref }}
  cancel-in-progress: false

env:
  KARAVOX_APPLICATION_ID: com.cassiel.karavox
  KARAVOX_APP_NAME: KaraVox

jobs:
  release:
    name: Verify, sign and package KaraVox
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Verify KaraVox source policy
        run: bash scripts/ci/verify_karavox_project.sh

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KARAVOX_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KARAVOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KARAVOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KARAVOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "KARAVOX_RELEASE_KEYSTORE_B64 is not configured" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "KARAVOX_STORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KARAVOX_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KARAVOX_KEY_PASSWORD is not configured" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/karavox-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/karavox-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/karavox-signing/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/karavox-signing/release.keystore" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Run production verification suite
        run: |
          ./gradlew --console=plain --stacktrace --warning-mode summary \
            :app:testFossDebugUnitTest \
            :app:lintFossRelease \
            :app:assembleFossRelease

      - name: Locate Android build tools
        id: build-tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          echo "dir=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Align and sign production APK
        env:
          STORE_PASSWORD: ${{ secrets.KARAVOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KARAVOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KARAVOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -f "$UNSIGNED_APK"
          mkdir -p dist
          "${{ steps.build-tools.outputs.dir }}/zipalign" -f -p 4 "$UNSIGNED_APK" dist/KaraVox.apk
          "${{ steps.build-tools.outputs.dir }}/apksigner" sign \
            --ks "$RUNNER_TEMP/karavox-signing/release.keystore" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/KaraVox-signed.apk \
            dist/KaraVox.apk
          mv dist/KaraVox-signed.apk dist/KaraVox.apk
          "${{ steps.build-tools.outputs.dir }}/apksigner" verify --verbose --print-certs dist/KaraVox.apk
          sha256sum dist/KaraVox.apk | tee dist/KaraVox.apk.sha256

      - name: Upload verified production APK
        uses: actions/upload-artifact@v6
        with:
          name: karavox-production-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/KaraVox.apk
            dist/KaraVox.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$MANUAL_VERSION"
          fi
          test -n "$VERSION"
          gh release view "$VERSION" >/dev/null 2>&1 && {
            gh release upload "$VERSION" dist/KaraVox.apk dist/KaraVox.apk.sha256 --clobber
          } || {
            gh release create "$VERSION" \
              dist/KaraVox.apk dist/KaraVox.apk.sha256 \
              --title "KaraVox $VERSION" \
              --generate-notes
          }
