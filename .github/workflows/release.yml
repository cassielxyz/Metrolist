name: KaraVox Release Candidate Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karavox-release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  KARAVOX_APPLICATION_ID: com.cassiel.karavox
  KARAVOX_APP_NAME: KaraVox
  KARAVOX_DEBUG_KEYSTORE_PATH: ci-debug.keystore
  KARAVOX_DEBUG_KEYSTORE_PASSWORD: android
  KARAVOX_DEBUG_KEY_ALIAS: androiddebugkey
  KARAVOX_DEBUG_KEY_PASSWORD: android

jobs:
  release-candidate:
    name: Verify release candidate (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Verify KaraVox source policy
        run: bash scripts/ci/verify_karavox_project.sh

      - name: Build and lint release candidate
        run: |
          ./gradlew --console=plain --stacktrace --warning-mode summary \
            assemble${{ matrix.variantName }}Release \
            :app:lint${{ matrix.variantName }}Release

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v6
        with:
          name: karavox-${{ matrix.variant }}-release-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/${{ matrix.variant }}/release/*.apk

# Publishing/signing is intentionally not automated yet.
# KaraVox will add a separate protected release workflow after the project is moved to its
# independent repository and production signing keys/release permissions are configured.
