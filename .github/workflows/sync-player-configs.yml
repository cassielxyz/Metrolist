name: KaraVox Player Config Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karavox-player-config-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh online playback configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate latest player configs
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json" \
            -o /tmp/player_configs_new.json
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/player_dates.json" \
            -o /tmp/player_dates_new.json
          jq empty /tmp/player_configs_new.json
          jq empty /tmp/player_dates_new.json

      - name: Compare and update
        id: check_sync
        run: |
          set -euo pipefail
          changed=false

          if ! diff -q "app/src/main/assets/player_configs.json" /tmp/player_configs_new.json > /dev/null; then
            mv /tmp/player_configs_new.json "app/src/main/assets/player_configs.json"
            changed=true
          fi

          if ! diff -q "app/src/main/assets/player_dates.json" /tmp/player_dates_new.json > /dev/null; then
            mv /tmp/player_dates_new.json "app/src/main/assets/player_dates.json"
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit verified config update
        if: steps.check_sync.outputs.changed == 'true'
        run: |
          git config user.name "KaraVox CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/player_configs.json app/src/main/assets/player_dates.json
          git commit -m "chore: refresh online playback configs"
          git push origin main

      - name: No update needed
        if: steps.check_sync.outputs.changed != 'true'
        run: echo "Player configs are already current."

# This workflow is intentionally manual while KaraVox is still being separated from its
# inherited repository. Re-enable a schedule only after the independent KaraVox repository is live.
