name: KaraVox Manual APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_debug:
    name: Build Debug (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate isolated KaraVox debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KaraVox Manual Build,O=KaraVox,C=IN"

      - name: Build debug APK and lint
        run: |
          ./gradlew --console=plain --stacktrace --warning-mode summary \
            assemble${{ matrix.variantName }}Debug \
            :app:lint${{ matrix.variantName }}Debug
        env:
          KARAVOX_APPLICATION_ID: com.cassiel.karavox.manual
          KARAVOX_APP_NAME: KaraVox Manual
          KARAVOX_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          KARAVOX_DEBUG_KEYSTORE_PASSWORD: android
          KARAVOX_DEBUG_KEY_ALIAS: androiddebugkey
          KARAVOX_DEBUG_KEY_PASSWORD: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: karavox-${{ matrix.variant }}-debug-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/${{ matrix.variant }}/debug/*.apk
